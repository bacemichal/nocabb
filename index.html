<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
    <script src="shop.js" defer></script>
    <script src="menu.js" defer></script>
</head>
<body>

    <header>
        <div class="container">
            <div class="nav">
                <nav class="nav-link">
                    <a href="lookbook.html">Lookbook &#x2197;</a>
                    <a href="#" class="nav-more">More &#x2197;</a>
                    <a href="index.html" class="nav-logo">
                        <img src="assets/images/logo.svg" alt="Nocabb Creative Lab">
                    </a>
                </nav>
                

            </div>
            
        </div> 
    </header>
    
    <main>

        <section class="hero-main">
            <div class="container">
                <h1>Shop</h1>
            </div>
        </section>

        <section class="filters">
            <div class="container">
                <div class="filters-layout">
                    <button class="btn btn--primary btn--small" onclick="zafiltruj('all')">
                        All (<span id="count-all">0</span>)
                    </button>
                    <button class="btn btn--secondary btn--small" onclick="zafiltruj('jackets')">
                        Jackets (<span id="count-jackets">0</span>)
                    </button>
                    <button class="btn btn--secondary btn--small" onclick="zafiltruj('bags')">
                        Bags (<span id="count-bags">0</span>)
                    </button>
                    <button class="btn btn--secondary btn--small" onclick="zafiltruj('accessories')">
                        Accessories (<span id="count-accessories">0</span>)
                    </button>
                    <button class="btn btn--secondary btn--small" onclick="zafiltruj('gobelin')">
                        Gobelin drop (<span id="count-gobelin">0</span>)
                    </button>
                </div>
            </div>
        </section>

        <section class="product">
            <div class="container">
                <div class="product-grid"></div>
            </div>
        </section>


        


    </main>

    <div class="product-cursor" aria-hidden="true">
        <svg class="product-cursor__arrow" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M4.5 13.5L13.5 4.5M13.5 4.5H7.5M13.5 4.5V10.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-layout">
                <div class="link-list">
                    <a href="about.html" class="list-item">
                        <span class="link-text">About Nocabb</span>
                        <span class="link-arrow">&#x2197;</span>
                    </a>
                    <a href="lookbook.html?collection=gobelin-drop" class="list-item">
                        <span class="link-text">Gobelin drop (lookbook)</span>
                        <span class="link-arrow">&#x2197;</span>
                    </a>
                </div>
                <div class="newsletter">
                    <p>
                        Be the first to get info about new stuff. Leave email below and get notified about news
                    </p>
                    <form
                            class="inline-form"
                            action="https://docs.google.com/forms/d/e/1FAIpQLSfeZ9GiQ0UnGejwzJj2KGxR30p-2bkfdQYIxSFQHJTo467yzA/formResponse"
                            method="POST"
                            target="newsletter_iframe"
                        >
                        <input type="text" name="username" class="honeypot" style="display:none;" tabindex="-1" autocomplete="off">
                        <input
                            class="input-primary"
                            type="email"
                            name="entry.422034782"
                            placeholder="@"
                            required
                        >
                        <button class="btn btn--primary" type="submit">Confirm</button>
                    </form>
                    <iframe name="newsletter_iframe" style="display:none;"></iframe>
                </div>
            </div>
        </div>
    </footer>



</body>
</html>
